<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>登录 - 合阳洽川湿地智慧管理平台</title>
<style>
:root {
  --bg: #f0f4f3;
  --surface: #ffffff;
  --primary: #1a936f;
  --primary-dark: #147a5c;
  --primary-light: rgba(26, 147, 111, 0.08);
  --danger: #e74c3c;
  --text: #1a1a1a;
  --text-secondary: #666666;
  --text-tertiary: #999999;
  --border: #e8eceb;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%; min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
}

/* iOS SafeArea */
body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

.container {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 28px;
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
}

/* Logo */
.logo-area {
  text-align: center;
  margin-bottom: 40px;
}

.logo-icon {
  width: 72px; height: 72px;
  margin: 0 auto 16px;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
  box-shadow: 0 8px 24px rgba(26,147,111,0.3);
}

.logo-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--primary);
}

.logo-sub {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 6px;
  letter-spacing: 1px;
}

/* Form */
.form-card {
  width: 100%;
  background: var(--surface);
  border-radius: 16px;
  padding: 28px 24px;
  box-shadow: var(--shadow);
}

.input-group {
  margin-bottom: 18px;
}

.input-label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 6px;
  display: block;
  font-weight: 500;
}

.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: all 0.2s;
  height: 48px;
}

.input-wrap:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-light);
}

.input-icon {
  padding: 0 12px;
  font-size: 16px;
  color: var(--text-tertiary);
  flex-shrink: 0;
}

.input-field {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 15px;
  padding: 0 12px 0 0;
  outline: none;
  height: 100%;
}

.input-field::placeholder { color: var(--text-tertiary); }

.code-btn {
  padding: 8px 12px;
  margin-right: 6px;
  border-radius: 8px;
  border: 1px solid var(--primary);
  background: var(--primary-light);
  color: var(--primary);
  font-size: 12px;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
  white-space: nowrap;
  font-weight: 600;
  min-height: 36px;
  min-width: 88px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.code-btn:active { background: rgba(26,147,111,0.18); }
.code-btn.disabled {
  border-color: var(--border);
  color: var(--text-tertiary);
  background: transparent;
  cursor: not-allowed;
}

.login-btn {
  width: 100%;
  padding: 15px 0;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.2s;
  letter-spacing: 2px;
  min-height: 48px;
}

.login-btn:active { transform: scale(0.98); opacity: 0.9; }

.remember-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 16px;
  font-size: 13px;
  color: var(--text-secondary);
}

.checkbox-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  min-height: 44px;
}

.checkbox-wrap input[type="checkbox"] {
  width: 18px; height: 18px;
  accent-color: var(--primary);
  cursor: pointer;
}

.role-select {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

.role-pill {
  flex: 1;
  padding: 10px 0;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-secondary);
  font-size: 13px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 500;
}

.role-pill.active {
  border-color: var(--primary);
  background: var(--primary-light);
  color: var(--primary);
}

.footer-hint {
  text-align: center;
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 24px;
  padding-bottom: env(safe-area-inset-bottom);
}
</style>
<!-- === 弹窗组件 START === -->
<style>
.m-toast-wrap { position:fixed; top:calc(16px + env(safe-area-inset-top)); left:16px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.m-toast { padding:12px 16px; border-radius:10px; font-size:14px; font-weight:500; color:#fff; animation:mToastIn 0.3s ease; pointer-events:auto; display:flex; align-items:center; gap:8px; box-shadow:0 4px 16px rgba(0,0,0,0.15); }
.m-toast.success { background:linear-gradient(135deg,#1a936f,#147a5c); }
.m-toast.error { background:linear-gradient(135deg,#e74c3c,#c0392b); }
.m-toast.info { background:linear-gradient(135deg,#3498db,#2980b9); }
@keyframes mToastIn { from { opacity:0; transform:translateY(-20px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes mToastOut { to { opacity:0; transform:translateY(-20px) scale(0.95); } }
.m-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:9998; display:none; align-items:center; justify-content:center; padding:16px; }
.m-modal-overlay.active { display:flex; }
.m-modal { background:#fff; border-radius:14px; padding:20px; width:100%; max-width:340px; box-shadow:0 12px 40px rgba(0,0,0,0.15); }
.m-modal-title { font-size:17px; font-weight:700; color:#1a1a1a; margin-bottom:10px; }
.m-modal-body { font-size:14px; color:#666; line-height:1.6; margin-bottom:20px; }
.m-modal-actions { display:flex; gap:10px; }
.m-btn { flex:1; padding:13px 0; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; border:none; text-align:center; }
.m-btn-primary { background:linear-gradient(135deg,#1a936f,#147a5c); color:#fff; }
.m-btn-secondary { background:#f0f4f3; color:#666; }
.m-sheet-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:9998; display:none; align-items:flex-end; justify-content:center; }
.m-sheet-overlay.active { display:flex; }
.m-sheet { background:#fff; border-radius:16px 16px 0 0; padding:16px; width:100%; max-width:500px; transform:translateY(100%); transition:transform .3s ease; }
.m-sheet-overlay.active .m-sheet { transform:translateY(0); }
.m-sheet-title { font-size:16px; font-weight:700; color:#1a1a1a; text-align:center; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid #e8eceb; }
.m-sheet-item { padding:14px; text-align:center; font-size:15px; color:#1a1a1a; cursor:pointer; border-bottom:1px solid #f0f4f3; }
.m-sheet-item:last-child { border-bottom:none; color:#e74c3c; font-weight:600; }
.m-loading-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:9999; display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
.m-loading-overlay.active { display:flex; }
.m-loading-spinner { width:48px; height:48px; border:4px solid rgba(255,255,255,0.2); border-top-color:#fff; border-radius:50%; animation:mSpin 0.8s linear infinite; }
.m-loading-text { color:#fff; font-size:15px; font-weight:600; }
@keyframes mSpin { to { transform:rotate(360deg); } }
</style>
<div id="mToastWrap" class="m-toast-wrap"></div>
<div id="mModalOverlay" class="m-modal-overlay" onclick="if(event.target===this)closeMModal()"><div class="m-modal"><div id="mModalTitle" class="m-modal-title">提示</div><div id="mModalBody" class="m-modal-body">内容</div><div class="m-modal-actions"><button class="m-btn m-btn-secondary" onclick="closeMModal()">取消</button><button id="mModalConfirm" class="m-btn m-btn-primary">确认</button></div></div></div>
<div id="mSheetOverlay" class="m-sheet-overlay" onclick="if(event.target===this)closeMSheet()"><div class="m-sheet"><div id="mSheetTitle" class="m-sheet-title">选择操作</div><div id="mSheetBody"></div></div></div>
<div id="mLoadingOverlay" class="m-loading-overlay"><div class="m-loading-spinner"></div><div id="mLoadingText" class="m-loading-text">加载中...</div></div>
<script>
function showToast(msg,type){var w=document.getElementById('mToastWrap');var t=document.createElement('div');t.className='m-toast '+(type||'success');t.innerHTML=msg;w.appendChild(t);setTimeout(function(){t.style.animation='mToastOut 0.3s ease forwards';setTimeout(function(){t.remove()},300)},2700);}
function showModal(title,body,onConfirm){document.getElementById('mModalTitle').textContent=title||'提示';document.getElementById('mModalBody').textContent=body||'';var btn=document.getElementById('mModalConfirm');btn.onclick=function(){closeMModal();if(onConfirm)onConfirm();};document.getElementById('mModalOverlay').classList.add('active');}
function closeMModal(){document.getElementById('mModalOverlay').classList.remove('active');}
function showConfirm(title,body,onConfirm){showModal(title,body,onConfirm);}
function showActionSheet(title,items){document.getElementById('mSheetTitle').textContent=title||'选择操作';var b=document.getElementById('mSheetBody');b.innerHTML='';items.forEach(function(it){var d=document.createElement('div');d.className='m-sheet-item';d.textContent=it.text;d.onclick=function(){closeMSheet();if(it.action)it.action();};b.appendChild(d);});document.getElementById('mSheetOverlay').classList.add('active');}
function closeMSheet(){document.getElementById('mSheetOverlay').classList.remove('active');}
function showLoading(msg){document.getElementById('mLoadingText').textContent=msg||'加载中...';document.getElementById('mLoadingOverlay').classList.add('active');}
function hideLoading(){document.getElementById('mLoadingOverlay').classList.remove('active');}
</script>
<!-- === 弹窗组件 END === -->
</head>
<body>

<div class="container">
  <div class="logo-area">
    <div class="logo-icon">&#x1F3D9;</div>
    <div class="logo-title">合阳湿地</div>
    <div class="logo-sub">智慧管理平台</div>
  </div>

  <div class="form-card">
    <div class="role-select">
      <div class="role-pill active" onclick="selectRole(this)">巡逻人员</div>
      <div class="role-pill" onclick="selectRole(this)">指挥中心</div>
    </div>

    <div class="input-group">
      <label class="input-label">手机号</label>
      <div class="input-wrap">
        <span class="input-icon">&#x1F4F1;</span>
        <input class="input-field" type="tel" id="phone" placeholder="请输入手机号" maxlength="11" inputmode="numeric">
      </div>
    </div>

    <div class="input-group">
      <label class="input-label">验证码</label>
      <div class="input-wrap">
        <span class="input-icon">&#x1F510;</span>
        <input class="input-field" type="number" id="code" placeholder="请输入4位验证码" maxlength="4" inputmode="numeric">
        <button class="code-btn" id="sendCode" onclick="sendCode()">获取验证码</button>
      </div>
    </div>

    <button class="login-btn" onclick="login()">登 录</button>

    <div class="remember-row">
      <label class="checkbox-wrap">
        <input type="checkbox" checked>
        <span>7天内免登录</span>
      </label>
      <span style="color:var(--primary); font-weight:500;">问题反馈</span>
    </div>
  </div>

  <div class="footer-hint">合阳洽川湿地自然保护区 · 移动端专用</div>
</div>

<script>
let countdown = 0;
let timer = null;

function selectRole(el) {
  document.querySelectorAll('.role-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
}

function sendCode() {
  const phone = document.getElementById('phone').value;
  if (!/^1[3-9]\d{9}$/.test(phone)) {
    showToast('请输入正确的手机号', 'info');
    return;
  }
  if (countdown > 0) return;
  
  const btn = document.getElementById('sendCode');
  countdown = 60;
  btn.classList.add('disabled');
  btn.textContent = countdown + 's';
  
  timer = setInterval(() => {
    countdown--;
    if (countdown <= 0) {
      clearInterval(timer);
      btn.classList.remove('disabled');
      btn.textContent = '获取验证码';
    } else {
      btn.textContent = countdown + 's';
    }
  }, 1000);
}

function login() {
  const phone = document.getElementById('phone').value;
  const code = document.getElementById('code').value;
  if (!/^1[3-9]\d{9}$/.test(phone)) {
    showToast('请输入正确的手机号', 'info');
    return;
  }
  if (!/^\d{4}$/.test(code)) {
    showToast('请输入正确的4位验证码', 'info');
    return;
  }
  localStorage.setItem('userRole','user'); window.location.href = 'M01-首页.html';
}
</script>
</body>
</html>
