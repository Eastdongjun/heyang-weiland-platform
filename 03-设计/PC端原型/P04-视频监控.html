<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洽川湿地视频监控</title>
<style>
:root {
  --bg-deep: #0A1628;
  --bg-card: rgba(15, 30, 55, 0.85);
  --bg-card2: rgba(10, 28, 60, 0.6);
  --border: rgba(0, 191, 255, 0.15);
  --border-bright: rgba(0, 191, 255, 0.3);
  --accent: #00BFFF;
  --accent-dim: rgba(0, 191, 255, 0.12);
  --accent-glow: rgba(0, 191, 255, 0.25);
  --accent-bright: #00E5CC;
  --cyan: #00E5CC;
  --danger: #FF3366;
  --danger-glow: rgba(255, 51, 102, 0.3);
  --warn: #FFCC00;
  --green: #00CC99;
  --text: #FFFFFF;
  --text2: #CCCCCC;
  --text3: #8899AA;
  --text-dim: #8899AA;
  --font-num: "DIN Pro", "SF Mono", monospace;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg-deep);
  color: var(--text);
  font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  display: flex;
  flex-direction: column;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* ===== TOP HEADER (P03 Style) ===== */
.top-bar {
  height: 64px;
  background: linear-gradient(180deg, rgba(10,22,40,0.98), rgba(10,22,40,0.85));
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  flex-shrink: 0;
  position: relative;
  z-index: 100;
}
.top-bar::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 10%;
  right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: .6;
}
.top-left { display:flex; align-items:center; gap:16px; }
.top-title { font-size:20px; font-weight:700; letter-spacing:4px; background:linear-gradient(90deg,#fff,var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.top-title-sub { font-size:10px; color:var(--text3); letter-spacing:1px; margin-top:2px; }
.top-center { display:flex; flex-direction:column; align-items:center; gap:4px; }
.top-right { display:flex; align-items:center; gap:20px; font-size:13px; color:var(--text2); }
.top-time { font-size:18px; font-weight:600; color:var(--accent); font-family:var(--font-num); }
.top-weather { display:flex; align-items:center; gap:4px; color:var(--text3); }
.sys-status { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--accent); }
.status-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent-glow); animation:pulse-dot 2s infinite; }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ===== MAIN LAYOUT (P03 Style) ===== */
.main { flex:1; display:flex; flex-direction:column; min-height:0; position:relative; }
.main-row { flex:1; display:flex; gap:8px; padding:8px; min-height:0; }

/* ===== PANELS (P03 Style) ===== */
.panel { background:var(--bg-card); border:1px solid var(--border); border-radius:6px; padding:12px 14px; }
.panel-title { font-size:12px; font-weight:600; color:var(--accent); letter-spacing:1px; margin-bottom:10px; display:flex; align-items:center; gap:6px; text-transform:uppercase; }
.panel-title::before { content:''; width:3px; height:12px; background:var(--accent); border-radius:2px; flex-shrink:0; }

/* LEFT PANEL - Camera List */
.left-panel {
  width: 260px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
}
.left-panel::-webkit-scrollbar { width: 3px; }
.left-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Camera Group */
.cam-group {
  border-bottom: 1px solid var(--border);
}

.cam-group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 4px;
  cursor: pointer;
  transition: background 0.2s;
  border-radius: 3px;
}

.cam-group-header:hover { background: rgba(0, 191, 255, 0.04); }

.cam-group-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 8px;
}

.cam-group-count {
  font-size: 10px;
  color: var(--text-dim);
  background: rgba(0, 191, 255, 0.08);
  padding: 2px 8px;
  border-radius: 4px;
}

.cam-group-arrow {
  font-size: 10px;
  color: var(--text-dim);
  transition: transform 0.3s;
}

.cam-group.collapsed .cam-group-arrow { transform: rotate(-90deg); }
.cam-group.collapsed .cam-list { display: none; }

.cam-list { display: flex; flex-direction: column; }

.cam-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 4px 6px 16px;
  cursor: pointer;
  transition: all 0.2s;
  border-left: 3px solid transparent;
  border-radius: 0 3px 3px 0;
}

.cam-item:hover { background: rgba(0, 191, 255, 0.05); }

.cam-item.active {
  background: rgba(0, 191, 255, 0.08);
  border-left: 3px solid var(--accent);
}

.cam-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.cam-dot.online { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
.cam-dot.offline { background: #FF3366; box-shadow: 0 0 6px rgba(255,51,102,0.3); }
.cam-dot.warning { background: var(--warning); box-shadow: 0 0 6px rgba(255,204,0,0.4); }

.cam-info { flex: 1; min-width: 0; }

.cam-name {
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cam-code {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 1px;
}

.cam-status {
  font-size: 10px;
  color: var(--text-dim);
  flex-shrink: 0;
}

/* CENTER - Video Wall */
.col-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.col-center::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: .5;
  z-index: 2;
  pointer-events: none;
}

/* Layout switch */
.layout-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  flex-shrink: 0;
}

.layout-btn {
  padding: 5px 14px;
  background: rgba(0, 191, 255, 0.06);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.layout-btn:hover, .layout-btn.active {
  background: rgba(0, 191, 255, 0.15);
  border-color: var(--accent);
  color: var(--accent-bright);
}

/* Grid container */
.video-grid {
  flex: 1;
  display: grid;
  gap: 6px;
  padding: 0 12px 12px;
  min-height: 0;
}

.video-grid.layout-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.video-grid.layout-4 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
.video-grid.layout-6 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
.video-grid.layout-9 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
.video-grid.layout-16 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }

/* Video cell */
.video-cell {
  background: #0D1B2A;
  border: 1px solid var(--border);
  border-radius: 6px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.video-cell:hover { border-color: var(--border-bright); }

.video-cell.active {
  border-color: var(--accent);
  box-shadow: 0 0 16px rgba(0,191,255,0.1), inset 0 0 20px rgba(0,191,255,0.02);
}

.video-placeholder {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background:
    linear-gradient(135deg, #0D1B2A 25%, transparent 25%) -1px 0,
    linear-gradient(225deg, #0D1B2A 25%, transparent 25%) -1px 0,
    linear-gradient(315deg, #0D1B2A 25%, transparent 25%),
    linear-gradient(45deg, #0D1B2A 25%, transparent 25%);
  background-size: 8px 8px;
  background-color: #0D1B2A;
  min-height: 0;
}

.video-placeholder::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px
  );
  pointer-events: none;
}

.video-no-signal {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: var(--text-dim);
}

.video-no-signal .icon { font-size: 32px; opacity: 0.4; }
.video-no-signal .text { font-size: 12px; letter-spacing: 2px; }

.video-cell-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 10px;
  background: rgba(10, 28, 60, 0.85);
  border-top: 1px solid var(--border);
}

.cell-name {
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
}

.cell-status {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 4px var(--accent-glow);
}

.cell-time {
  font-size: 10px;
  color: var(--text-dim);
  font-family: monospace;
}

/* RIGHT PANEL - PTZ Control */
.right-panel {
  width: 280px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
}
.right-panel::-webkit-scrollbar { width: 3px; }
.right-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Device Info */
.dev-info {
  padding: 0;
}

.dev-info-row {
  display: flex;
  justify-content: space-between;
  padding: 5px 0;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
}
.dev-info-row:last-child { border-bottom: none; }

.dev-info-label { color: var(--text-dim); }
.dev-info-value { color: var(--text); font-weight: 500; }
.dev-info-value.online { color: var(--accent); }
.dev-info-value.offline { color: var(--danger); }

/* PTZ Pad */
.ptz-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  width: 140px;
  margin: 0 auto;
}

.ptz-btn {
  width: 42px; height: 42px;
  background: rgba(0, 191, 255, 0.06);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-dim);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}

.ptz-btn:hover {
  background: rgba(0, 191, 255, 0.15);
  border-color: var(--accent);
  color: var(--accent-bright);
  box-shadow: 0 0 12px rgba(0,191,255,0.1);
}

.ptz-btn.center {
  background: rgba(0, 191, 255, 0.12);
  border-color: var(--border-bright);
}

/* Zoom */
.zoom-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  padding: 0 8px;
}

.zoom-label {
  font-size: 11px;
  color: var(--text-dim);
  width: 28px;
}

.zoom-bar {
  flex: 1;
  height: 6px;
  background: rgba(0, 191, 255, 0.1);
  border-radius: 3px;
  position: relative;
}

.zoom-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 45%;
  background: linear-gradient(90deg, var(--accent), var(--accent-bright));
  border-radius: 3px;
  box-shadow: 0 0 8px var(--accent-glow);
}

.zoom-btn {
  width: 28px; height: 28px;
  background: rgba(0, 191, 255, 0.06);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}

.zoom-btn:hover {
  border-color: var(--accent);
  color: var(--accent-bright);
}

/* Presets */
.preset-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.preset-btn {
  padding: 8px 0;
  background: rgba(0, 191, 255, 0.05);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.preset-btn:hover {
  border-color: var(--accent);
  color: var(--accent-bright);
  background: rgba(0, 191, 255, 0.1);
}

/* Recording buttons row */
.recording-row {
  display: flex;
  gap: 8px;
}

/* BOTTOM NAVIGATION */
.bottom-nav {
  height: 52px;
  background: linear-gradient(180deg, transparent, #0A1628 30%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  flex-shrink: 0;
  padding: 0 12px;
}

.nav-btn {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 4px 10px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  color: var(--text3);
  font-size: 10px;
  cursor: pointer;
  transition: all 0.25s;
  min-width: 56px;
  text-decoration: none;
}

.nav-btn:hover {
  background: var(--accent-dim);
  border-color: var(--border);
  color: var(--accent);
  transform: translateY(-2px);
}

.nav-btn.active {
  background: rgba(0, 191, 255, 0.1);
  border-color: var(--border-bright);
  color: var(--accent);
}

.nav-btn.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 30%; right: 30%;
  height: 2px;
  background: var(--accent);
  border-radius: 1px;
  box-shadow: 0 0 6px var(--accent-glow);
}

.nav-icon svg { width: 16px; height: 16px; display:block; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition: transform 0.25s; }
.nav-btn:hover .nav-icon svg { transform: scale(1.12); }

/* Scanline effect */
.scanlines {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
  );
}

/* Map frame decorative border for video wall */
.map-frame {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border: 1px solid rgba(0, 191, 255, 0.22);
  border-radius: 4px;
  pointer-events: none;
  box-shadow:
    0 0 0 1px rgba(0, 191, 255, 0.06),
    0 0 40px rgba(0, 191, 255, 0.06),
    inset 0 0 60px rgba(0, 191, 255, 0.02);
}

.map-frame .mf-corner {
  position: absolute;
  width: 18px; height: 18px;
  pointer-events: none;
}
.map-frame .mf-corner.tl { top: -1px; left: -1px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
.map-frame .mf-corner.tr { top: -1px; right: -1px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
.map-frame .mf-corner.bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
.map-frame .mf-corner.br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); box-shadow: 0 0 8px var(--accent-glow); }

@keyframes map-scan {
  0% { top: 0; opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { top: 100%; opacity: 0; }
}
.map-frame::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0;
  animation: map-scan 4s ease-in-out infinite;
}

/* Toast / Modal components */
.pc-toast-wrap { position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.pc-toast { padding:10px 24px; border-radius:6px; font-size:13px; font-weight:500; color:#fff; backdrop-filter:blur(8px); animation:pcToastIn 0.3s ease; pointer-events:auto; display:flex; align-items:center; gap:8px; box-shadow:0 4px 20px rgba(0,0,0,0.3); }
.pc-toast.success { background:rgba(0,120,191,0.92); border:1px solid rgba(0,191,255,0.4); }
.pc-toast.error { background:rgba(231,76,60,0.92); border:1px solid rgba(255,51,102,0.3); }
.pc-toast.info { background:rgba(52,152,219,0.92); border:1px solid rgba(64,169,255,0.4); }
@keyframes pcToastIn { from { opacity:0; transform:translateY(-20px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes pcToastOut { to { opacity:0; transform:translateY(-20px) scale(0.95); } }
.pc-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:9998; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
.pc-modal-overlay.active { display:flex; }
.pc-modal { background:rgba(15,30,55,0.96); border:1px solid rgba(0,191,255,0.25); border-radius:10px; padding:24px; min-width:360px; max-width:480px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
.pc-modal-title { font-size:16px; font-weight:600; color:#00BFFF; margin-bottom:12px; }
.pc-modal-body { font-size:14px; color:#FFFFFF; line-height:1.6; margin-bottom:20px; }
.pc-modal-actions { display:flex; justify-content:flex-end; gap:10px; }
.pc-btn { padding:8px 20px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; border:none; transition:all .15s; }
.pc-btn:hover { opacity:.9; }
.pc-btn-primary { background:linear-gradient(135deg,#00BFFF,#0077CC); color:#0A1628; }
.pc-btn-secondary { background:rgba(0,191,255,0.08); color:#00BFFF; border:1px solid rgba(0,191,255,0.25); }
.pc-loading-overlay { position:fixed; inset:0; background:rgba(10,22,40,0.7); z-index:9999; display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
.pc-loading-overlay.active { display:flex; }
.pc-loading-spinner { width:48px; height:48px; border:3px solid rgba(0,191,255,0.15); border-top-color:#00BFFF; border-radius:50%; animation:pcSpin 0.8s linear infinite; }
.pc-loading-text { color:#00BFFF; font-size:14px; }
@keyframes pcSpin { to { transform:rotate(360deg); } }

::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
::-webkit-scrollbar-track { background:transparent; }
</style>

.pc-btn { padding:8px 20px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; border:none; transition:all .15s; }
.pc-btn:hover { opacity:.9; }
.pc-btn-primary { background:linear-gradient(135deg,#00BFFF,#0077CC); color:#0A1628; }
.pc-btn-secondary { background:rgba(0,191,255,0.08); color:#00BFFF; border:1px solid rgba(0,191,255,0.25); }
.pc-loading-overlay { position:fixed; inset:0; background:rgba(10,22,40,0.7); z-index:9999; display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
.pc-loading-overlay.active { display:flex; }
.pc-loading-spinner { width:48px; height:48px; border:3px solid rgba(0,191,255,0.15); border-top-color:#00BFFF; border-radius:50%; animation:pcSpin 0.8s linear infinite; }
.pc-loading-text { color:#00BFFF; font-size:14px; }
@keyframes pcSpin { to { transform:rotate(360deg); } }

<div id="pcModalOverlay" class="pc-modal-overlay" onclick="if(event.target===this)closeModal()"><div class="pc-modal"><div id="pcModalTitle" class="pc-modal-title">提示</div><div id="pcModalBody" class="pc-modal-body">内容</div><div class="pc-modal-actions"><button class="pc-btn pc-btn-secondary" onclick="closeModal()">取消</button><button id="pcModalConfirm" class="pc-btn pc-btn-primary">确认</button></div></div></div>
<div id="pcLoadingOverlay" class="pc-loading-overlay"><div class="pc-loading-spinner"></div><div id="pcLoadingText" class="pc-loading-text">加载中...</div></div>
<script>
function showToast(msg,type){var w=document.getElementById('pcToastWrap');var t=document.createElement('div');t.className='pc-toast '+(type||'success');t.innerHTML=msg;w.appendChild(t);setTimeout(function(){t.style.animation='pcToastOut 0.3s ease forwards';setTimeout(function(){t.remove()},300)},2700);}
function showModal(title,body,onConfirm){document.getElementById('pcModalTitle').textContent=title||'提示';document.getElementById('pcModalBody').textContent=body||'';var btn=document.getElementById('pcModalConfirm');btn.onclick=function(){closeModal();if(onConfirm)onConfirm();};document.getElementById('pcModalOverlay').classList.add('active');}
function closeModal(){document.getElementById('pcModalOverlay').classList.remove('active');}
function showConfirm(title,body,onConfirm){showModal(title,body,onConfirm);}
function showLoading(msg){document.getElementById('pcLoadingText').textContent=msg||'加载中...';document.getElementById('pcLoadingOverlay').classList.add('active');}
function hideLoading(){document.getElementById('pcLoadingOverlay').classList.remove('active');}
</script>

<script>
// Clock
function updateClock() {
  const now = new Date();
  const timeStr = now.toTimeString().slice(0, 8);
  const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const dateStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 ' + weekdays[now.getDay()];
  document.getElementById('clock').textContent = timeStr;
  document.getElementById('date').textContent = dateStr;
}
setInterval(updateClock, 1000);
updateClock();

// Camera data
const camGroups = [
  { name: '核心区', cams: [
    { name: '核心区热成像云台', code: 'CAM-0192', status: 'online' },
    { name: '核心区东缘摄像头', code: 'CAM-0501', status: 'online' },
    { name: '核心区北入口', code: 'CAM-0001', status: 'online' },
  ]},
  { name: '缓冲区', cams: [
    { name: '南岸4G球机', code: 'CAM-0203', status: 'warning' },
    { name: '码头监控', code: 'CAM-0301', status: 'online' },
    { name: '观鸟台摄像头', code: 'CAM-0105', status: 'offline' },
  ]},
  { name: '实验区', cams: [
    { name: '处女泉云台', code: 'PTZ-0101', status: 'online' },
    { name: '滩地西缘云台', code: 'PTZ-0102', status: 'online' },
  ]},
  { name: '外围/全景', cams: [
    { name: '福山制高点摄像头', code: 'CAM-0401', status: 'online' },
    { name: '东北瞭望塔', code: 'TOW-0001', status: 'online' },
    { name: '南岸瞭望塔', code: 'TOW-0002', status: 'online' },
    { name: '全景球机-北区', code: 'CAM-0601', status: 'online' },
    { name: '全景球机-南区', code: 'CAM-0602', status: 'online' },
  ]}
];

function renderCamList() {
  const container = document.getElementById('camGroups');
  container.innerHTML = camGroups.map((g, gi) => `
    <div class="cam-group ${gi === 0 ? '' : 'collapsed'}">
      <div class="cam-group-header" onclick="this.parentElement.classList.toggle('collapsed')">
        <div class="cam-group-title">
          <span class="cam-group-arrow">▼</span>
          ${g.name}
        </div>
        <span class="cam-group-count">${g.cams.length}台</span>
      </div>
      <div class="cam-list">
        ${g.cams.map((c, ci) => `
          <div class="cam-item ${gi===0&&ci===0?'active':''}" onclick="selectCam(this, '${c.name}', '${c.code}')">
            <div class="cam-dot ${c.status}"></div>
            <div class="cam-info">
              <div class="cam-name">${c.name}</div>
              <div class="cam-code">${c.code}</div>
            </div>
            <span class="cam-status">${c.status === 'online' ? '在线' : c.status === 'warning' ? '告警' : '离线'}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function selectCam(el, name, code) {
  document.querySelectorAll('.cam-item').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('devName').textContent = name;
}

renderCamList();

// Video grid
const videoNames = [
  'CAM-0192 核心区热成像',
  'CAM-0501 核心区东缘',
  'CAM-0001 北入口',
  'CAM-0203 南岸4G球机',
  'CAM-0301 码头监控',
  'CAM-0105 观鸟台',
  'PTZ-0101 处女泉',
  'PTZ-0102 滩地西缘',
  'CAM-0401 福山制高点',
  'TOW-0001 东北瞭望塔',
  'TOW-0002 南岸瞭望塔',
  'CAM-0601 全景北区',
  'CAM-0602 全景南区',
  'CAM-0701 入口球机',
  'CAM-0702 出口球机',
  'CAM-0801 河堤巡视'
];

function renderGrid(count) {
  const grid = document.getElementById('videoGrid');
  grid.className = 'video-grid layout-' + count;
  grid.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const name = videoNames[i] || `通道 ${String(i+1).padStart(2,'0')}`;
    const isOffline = name.includes('观鸟台');
    grid.innerHTML += `
      <div class="video-cell ${i===0?'active':''}">
        <div class="video-placeholder">
          <div class="video-no-signal">
            <div class="icon">${isOffline ? '🔕' : '📹'}</div>
            <div class="text">${isOffline ? '信号中断' : '实时视频流'}</div>
          </div>
        </div>
        <div class="video-cell-bar">
          <span class="cell-name">
            <span class="cell-status" style="background:${isOffline?'#FF3366':'var(--accent)'};box-shadow:0 0 4px ${isOffline?'rgba(255,51,102,0.25)':'var(--accent-glow)'};"></span>
            ${name}
          </span>
          <span class="cell-time">${new Date().toTimeString().slice(0,8)}</span>
        </div>
      </div>
    `;
  }
}

function setLayout(n) {
  document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderGrid(n);
}

renderGrid(4);
</script>
