<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>系统参数 - 合阳湿地后台管理</title>
<style>
:root { --bg:#f0f2f5; --sidebar:#001529; --header:#ffffff; --card:#ffffff; --hover:#e6f7ff; --border:#e8e8e8; --accent:#1890ff; --text:#333333; --text2:#666666; --text3:#999999; --danger:#ff4d4f; --warn:#faad14; --success:#52c41a; --info:#1890ff; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:"PingFang SC","Microsoft YaHei",sans-serif; height:100vh; overflow:hidden; }
.header { height:50px; background:var(--header); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 20px; }
.header-left { display:flex; align-items:center; gap:12px; font-size:16px; font-weight:600; }
.header-left a { color:#666; text-decoration:none; font-size:13px; }
.header-left a:hover { color:var(--accent); }
.header-right { display:flex; align-items:center; gap:16px; font-size:13px; color:var(--text2); }
.header-right span { cursor:pointer; }
.header-right span:hover { color:#1890ff; }
.container { display:flex; height:calc(100vh - 50px); }
.sidebar { width:200px; background:var(--sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:12px 0; overflow-y:auto; }
.sidebar-group { margin-bottom:8px; }
.sidebar-title { font-size:11px; color:rgba(255,255,255,0.45); text-transform:uppercase; letter-spacing:1px; padding:8px 16px; font-weight:600; }
.sidebar-item { display:flex; align-items:center; gap:10px; padding:9px 16px; font-size:13px; color:rgba(255,255,255,0.65); cursor:pointer; transition:all .15s; text-decoration:none; }
.sidebar-item:hover { background:#002140; color:#fff; }
.sidebar-item.active { background:rgba(24,144,255,0.15); color:#1890ff; border-left:3px solid #1890ff; padding-left:13px; }
.content { flex:1; padding:16px 20px; overflow-y:auto; }
.content-hd { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.content-hd h2 { font-size:18px; font-weight:600; }
.btn { font-size:12px; padding:6px 14px; border-radius:3px; cursor:pointer; border:none; font-family:inherit; }
.btn-primary { background:var(--accent); color:#fff; font-weight:600; }
.btn-secondary { background:transparent; color:var(--text2); border:1px solid var(--border); }
.btn-secondary:hover { border-color:var(--accent); color:var(--accent); }
.card { background:var(--card); border:1px solid var(--border); border-radius:4px; margin-bottom:14px; }
.card-hd { padding:12px 16px; border-bottom:1px solid var(--border); font-size:14px; font-weight:600; color:var(--accent); }
.card-bd { padding:16px; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.form-row { }
.form-row label { display:block; font-size:12px; color:var(--text3); margin-bottom:4px; }
.form-row input, .form-row select, .form-row textarea { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:3px; font-size:13px; font-family:inherit; outline:none; }
.form-row textarea { min-height:60px; resize:vertical; }
.form-row .hint { font-size:11px; color:var(--text3); margin-top:3px; }
.tag { font-size:11px; padding:2px 8px; border-radius:3px; font-weight:600; display:inline-block; }
.tag-green { background:rgba(68,170,102,0.12); color:var(--success); }
.tag-yellow { background:rgba(204,153,34,0.12); color:var(--warn); }
</style>
<!-- === 弹窗组件 START === -->
<style>
.pc-toast-wrap { position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.pc-toast { padding:10px 24px; border-radius:6px; font-size:13px; font-weight:500; color:#fff; backdrop-filter:blur(8px); animation:pcToastIn 0.3s ease; pointer-events:auto; display:flex; align-items:center; gap:8px; box-shadow:0 4px 20px rgba(0,0,0,0.3); }
.pc-toast.success { background:rgba(26,147,111,0.92); border:1px solid rgba(120,210,180,0.4); }
.pc-toast.error { background:rgba(231,76,60,0.92); border:1px solid rgba(255,77,79,0.4); }
.pc-toast.info { background:rgba(52,152,219,0.92); border:1px solid rgba(64,169,255,0.4); }
@keyframes pcToastIn { from { opacity:0; transform:translateY(-20px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes pcToastOut { to { opacity:0; transform:translateY(-20px) scale(0.95); } }
.pc-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:9998; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
.pc-modal-overlay.active { display:flex; }
.pc-modal { background:rgba(6,30,30,0.96); border:1px solid rgba(120,210,180,0.25); border-radius:10px; padding:24px; min-width:360px; max-width:480px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
.pc-modal-title { font-size:16px; font-weight:600; color:#78d2b4; margin-bottom:12px; }
.pc-modal-body { font-size:14px; color:#e0f0f0; line-height:1.6; margin-bottom:20px; }
.pc-modal-actions { display:flex; justify-content:flex-end; gap:10px; }
.pc-btn { padding:8px 20px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; border:none; transition:all .15s; }
.pc-btn:hover { opacity:.9; }
.pc-btn-primary { background:linear-gradient(135deg,#78d2b4,#5aaa8a); color:#020a0a; }
.pc-btn-secondary { background:rgba(120,210,180,0.08); color:#78d2b4; border:1px solid rgba(120,210,180,0.25); }
.pc-loading-overlay { position:fixed; inset:0; background:rgba(2,10,10,0.7); z-index:9999; display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
.pc-loading-overlay.active { display:flex; }
.pc-loading-spinner { width:48px; height:48px; border:3px solid rgba(120,210,180,0.15); border-top-color:#78d2b4; border-radius:50%; animation:pcSpin 0.8s linear infinite; }
.pc-loading-text { color:#78d2b4; font-size:14px; }
@keyframes pcSpin { to { transform:rotate(360deg); } }
</style>
<div id="pcToastWrap" class="pc-toast-wrap"></div>
<div id="pcModalOverlay" class="pc-modal-overlay" onclick="if(event.target===this)closeModal()"><div class="pc-modal"><div id="pcModalTitle" class="pc-modal-title">提示</div><div id="pcModalBody" class="pc-modal-body">内容</div><div class="pc-modal-actions"><button class="pc-btn pc-btn-secondary" onclick="closeModal()">取消</button><button id="pcModalConfirm" class="pc-btn pc-btn-primary">确认</button></div></div></div>
<div id="pcLoadingOverlay" class="pc-loading-overlay"><div class="pc-loading-spinner"></div><div id="pcLoadingText" class="pc-loading-text">加载中...</div></div>
<script>
function showToast(msg,type){var w=document.getElementById('pcToastWrap');var t=document.createElement('div');t.className='pc-toast '+(type||'success');t.innerHTML=msg;w.appendChild(t);setTimeout(function(){t.style.animation='pcToastOut 0.3s ease forwards';setTimeout(function(){t.remove()},300)},2700);}
function showModal(title,body,onConfirm){document.getElementById('pcModalTitle').textContent=title||'提示';document.getElementById('pcModalBody').textContent=body||'';var btn=document.getElementById('pcModalConfirm');btn.onclick=function(){closeModal();if(onConfirm)onConfirm();};document.getElementById('pcModalOverlay').classList.add('active');}
function closeModal(){document.getElementById('pcModalOverlay').classList.remove('active');}
function showConfirm(title,body,onConfirm){showModal(title,body,onConfirm);}
function showLoading(msg){document.getElementById('pcLoadingText').textContent=msg||'加载中...';document.getElementById('pcLoadingOverlay').classList.add('active');}
function hideLoading(){document.getElementById('pcLoadingOverlay').classList.remove('active');}
function saveConfig(){var inputs=document.querySelectorAll('.card-bd input, .card-bd select');var data={};inputs.forEach(function(el,i){data['param_'+i]=el.value;});showToast('配置保存成功', 'success');}
</script>
<!-- === 弹窗组件 END === -->
</head>
<body>
<header class="header">
  <div class="header-left"><span>💧 合阳湿地后台管理</span><a href="P02-导航页.html">← 返回导航</a></div>
  <div class="header-right"><span>2026-05-12 14:32:18</span><span>管理员</span><span onclick="location.href='P01-登录.html'">退出</span></div>
</header>
<div class="container">
  <aside class="sidebar">
    <div class="sidebar-group"><div class="sidebar-title">设备管理</div>
      <a class="sidebar-item" href="P11-设备台账.html">📹 设备台账</a>
      <a class="sidebar-item" href="P19-设备分组.html">📁 设备分组</a>
      <a class="sidebar-item" href="P20-流量维保.html">📊 流量维保</a>
    </div>
    <div class="sidebar-group"><div class="sidebar-title">工单调度</div>
      <a class="sidebar-item" href="P13-工单调度.html">📋 工单调度</a>
    </div>
    <div class="sidebar-group"><div class="sidebar-title">用户权限</div>
      <a class="sidebar-item" href="P12-用户管理.html">👤 用户管理</a>
      <a class="sidebar-item" href="P17-角色权限.html">🔐 角色权限</a>
    </div>
    <div class="sidebar-group"><div class="sidebar-title">巡逻管理</div>
      <a class="sidebar-item" href="P14-排班管理.html">📅 排班管理</a>
      <a class="sidebar-item" href="P15-考勤统计.html">📍 考勤统计</a>
    </div>
    <div class="sidebar-group"><div class="sidebar-title">系统运维</div>
      <a class="sidebar-item active" href="P18-系统参数.html">⚙️ 系统参数</a>
      <a class="sidebar-item" href="P16-操作日志.html">📝 操作日志</a>
    </div>
  </aside>
  <main class="content">
    <div class="content-hd"><h2>系统参数</h2><button class="btn btn-primary" onclick="saveConfig()">💾 保存配置</button></div>

    <div class="card">
      <div class="card-hd">站点信息</div>
      <div class="card-bd">
        <div class="form-row"><label>站点名称</label><input type="text" value="合阳湿地智慧管理平台"></div>
        <div class="form-row"><label>站点简称</label><input type="text" value="合阳湿地"></div>
        <div class="form-row"><label>Logo URL</label><input type="text" value="/assets/logo.png"><div class="hint">建议尺寸 120×40px</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-hd">地图默认配置</div>
      <div class="card-bd">
        <div class="form-row"><label>默认中心纬度</label><input type="text" value="35.23"></div>
        <div class="form-row"><label>默认中心经度</label><input type="text" value="110.28"></div>
        <div class="form-row"><label>默认缩放级别</label><input type="number" value="13" min="1" max="18"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-hd">系统运行参数</div>
      <div class="card-bd">
        <div class="form-row"><label>设备心跳间隔（秒）</label><input type="number" value="60"></div>
        <div class="form-row"><label>数据保留周期（天）</label><input type="number" value="90"><div class="hint">超过周期的历史数据将自动归档</div></div>
        <div class="form-row"><label>登录超时（分钟）</label><input type="number" value="30"></div>
        <div class="form-row"><label>并发会话数上限</label><input type="number" value="50"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-hd">告警阈值</div>
      <div class="card-bd">
        <div class="form-row"><label>风速告警阈值（m/s）</label><input type="number" value="15"></div>
        <div class="form-row"><label>设备离线告警延迟（分钟）</label><input type="number" value="5"></div>
        <div class="form-row"><label>工单超时提醒（小时）</label><input type="number" value="2"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-hd">通知配置</div>
      <div class="card-bd">
        <div class="form-row"><label>短信网关地址</label><input type="text" value="https://sms.example.com/api/send"></div>
        <div class="form-row"><label>推送AppKey</label><input type="text" value="************************"></div>
        <div class="form-row"><label>告警通知方式</label><select><option>短信+推送</option><option>仅短信</option><option>仅推送</option></select></div>
      </div>
    </div>

  </main>
</div>
</body>
</html>
