<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洽川湿地VR全景 - 合阳洽川湿地智慧管理平台</title>
<style>
:root {
  --bg-deep: #0A1628;
  --bg-card: rgba(15, 30, 55, 0.85);
  --bg-card2: rgba(10, 28, 60, 0.6);
  --accent: #00BFFF;
  --accent-dim: rgba(0, 191, 255, 0.12);
  --accent-glow: rgba(0, 191, 255, 0.25);
  --cyan: #00E5CC;
  --danger: #FF3366;
  --warn: #FFCC00;
  --green: #00CC99;
  --text: #FFFFFF;
  --text2: #CCCCCC;
  --text3: #8899AA;
  --border: rgba(0, 191, 255, 0.15);
  --border-bright: rgba(0, 191, 255, 0.3);
  --font-num: "DIN Pro", "SF Mono", monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg-deep); color:var(--text); font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif; width:100vw; height:100vh; overflow:hidden; display:flex; flex-direction:column; }

/* ===== HEADER ===== */
.top-bar { height:64px; background:linear-gradient(180deg,rgba(10,22,40,0.98),rgba(10,22,40,0.85)); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 28px; flex-shrink:0; position:relative; z-index:100; }
.top-bar::after { content:''; position:absolute; bottom:-1px; left:10%; right:10%; height:1px; background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:.6; }
.top-left { display:flex; align-items:center; gap:16px; }
.top-title { font-size:20px; font-weight:700; letter-spacing:4px; background:linear-gradient(90deg,#fff,var(--accent)); -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
.top-title-sub { font-size:10px; color:var(--text3); letter-spacing:1px; margin-top:2px; }
.top-center { display:flex; align-items:center; gap:4px; position:absolute;left:50%;transform:translateX(-50%);text-align:center; flex-direction:column; }
.top-right { display:flex; align-items:center; gap:20px; font-size:13px; color:var(--text2); }
.top-time { font-size:18px; font-weight:600; color:var(--accent); font-family:var(--font-num); }

/* ===== MAIN ===== */
.main { flex:1; display:flex; align-items:stretch; min-height:0; padding:8px; position:relative; }

/* ===== VR FULLSCREEN ===== */
.vr-full { flex:1; border:1px solid var(--border); border-radius:4px; overflow:hidden; cursor:pointer; position:relative; display:flex; flex-direction:column; background:linear-gradient(135deg,#0D2A3A 0%,#1A5A4A 30%,#0D2A3A 60%,#1A6A5A 100%); transition:border-color .3s; }
.vr-full:hover { border-color:var(--accent); }
.vr-full-bg { position:absolute; inset:0; background:radial-gradient(ellipse at 40% 30%, rgba(0,191,255,0.06) 0%, transparent 60%), radial-gradient(ellipse at 70% 80%, rgba(0,229,204,0.04) 0%, transparent 50%); pointer-events:none; }
.vr-full-content { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:2; }
.vr-full-icon { font-size:72px; margin-bottom:12px; filter:drop-shadow(0 8px 24px rgba(0,0,0,0.5)); animation:iconFloat 3s ease-in-out infinite; }
@keyframes iconFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.vr-full-title { font-size:28px; font-weight:700; color:#fff; letter-spacing:4px; margin-bottom:6px; text-shadow:0 2px 12px rgba(0,0,0,0.6); }
.vr-full-sub { font-size:14px; color:var(--text3); letter-spacing:2px; margin-bottom:20px; }
.vr-full-btn { display:flex; align-items:center; gap:8px; padding:10px 28px; border:1px solid var(--accent); border-radius:8px; background:rgba(0,191,255,0.12); color:var(--accent); font-size:14px; cursor:pointer; transition:all .3s; }
.vr-full-btn:hover { background:rgba(0,191,255,0.25); transform:scale(1.05); box-shadow:0 0 24px var(--accent-glow); }
.vr-full-badge { position:absolute; top:16px; left:16px; font-size:11px; padding:4px 14px; border-radius:20px; background:rgba(0,191,255,0.15); color:var(--accent); border:1px solid rgba(0,191,255,0.25); z-index:3; backdrop-filter:blur(4px); }
.vr-full-corner { position:absolute; width:16px;height:16px; border-color:var(--accent); border-style:solid; pointer-events:none; z-index:3; opacity:.5; }
.vr-full-corner.tl { top:-1px;left:-1px; border-width:2px 0 0 2px; }
.vr-full-corner.tr { top:-1px;right:-1px; border-width:2px 2px 0 0; }
.vr-full-corner.bl { bottom:-1px;left:-1px; border-width:0 0 2px 2px; }
.vr-full-corner.br { bottom:-1px;right:-1px; border-width:0 2px 2px 0; }

/* ===== BOTTOM NAV ===== */
.bottom-nav { height:52px; background:linear-gradient(180deg,transparent,#0A1628 30%); display:flex; align-items:center; justify-content:center; gap:4px; flex-shrink:0; padding:0 12px; }
.nav-btn { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:4px 10px; background:transparent; border:1px solid transparent; border-radius:6px; color:var(--text3); font-size:10px; cursor:pointer; transition:all .25s; min-width:56px; text-decoration:none; }
.nav-btn:hover { background:var(--accent-dim); border-color:var(--border); color:var(--accent); transform:translateY(-2px); }
.nav-btn.active { background:rgba(0,191,255,0.1); border-color:var(--border-bright); color:var(--accent); }
.nav-btn.active::after { content:''; position:absolute; bottom:-1px; left:30%; right:30%; height:2px; background:var(--accent); border-radius:1px; }
.nav-icon svg { width:16px; height:16px; display:block; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:transform .25s; }
.nav-btn:hover .nav-icon svg { transform:scale(1.12); }
</style>
</head>
<body>

<header class="top-bar">
  <div class="top-left"><span id="headerDate" style="font-size:13px;font-weight:600;color:var(--accent);font-family:var(--font-num);">--年--月--日</span></div>
  <div class="top-center"><div class="top-title">洽川湿地VR全景</div><div class="top-title-sub">沉浸体验 · 全景巡览</div></div>
  <div class="top-right"><span class="top-weather">☀️ 26°C · 晴</span><span class="top-time" id="clockSec">--:--:--</span><a href="P02-导航页.html" style="color:var(--text3);font-size:12px;text-decoration:none;padding:4px 10px;border:1px solid var(--border);border-radius:4px;">退出</a></div>
</header>

<main class="main">
  <div class="vr-full" onclick="showToast('湿地风光 360°全景加载中...','info')">
    <div class="vr-full-bg"></div>
    <div class="vr-full-corner tl"></div><div class="vr-full-corner tr"></div>
    <div class="vr-full-corner bl"></div><div class="vr-full-corner br"></div>
    <span class="vr-full-badge">360° 全景沉浸体验</span>
    <div class="vr-full-content">
      <div class="vr-full-icon">🏞️</div>
      <div class="vr-full-title">湿地风光</div>
      <div class="vr-full-sub">合阳湿地核心区 · 万亩芦苇水天一色</div>
      <button class="vr-full-btn">▶ 进入全景漫游</button>
    </div>
  </div>
</main>

<script>
function updateClock(){var n=new Date;document.getElementById('clockSec').textContent=n.toLocaleTimeString('zh-CN',{hour12:false});document.getElementById('headerDate').textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日';}
setInterval(updateClock,1000);updateClock();
function showToast(msg){alert(msg)}
</script>
