<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频回放 - 合阳洽川湿地智慧管理平台</title>
<style>
:root { --bg-deep:#0A1628; --bg-card:rgba(15,30,55,0.85); --bg-card2:rgba(10,28,60,0.6); --accent:#00BFFF; --accent-dim:rgba(0,191,255,0.12); --accent-glow:rgba(0,191,255,0.25); --accent-bright:#00E5CC; --cyan:#00E5CC; --border:rgba(0,191,255,0.15); --border-bright:rgba(0,191,255,0.3); --danger:#FF3366; --danger-glow:rgba(255,51,102,0.3); --warn:#FFCC00; --green:#00CC99; --text:#FFFFFF; --text2:#CCCCCC; --text3:#8899AA; --text-dim:#8899AA; --font-num:"DIN Pro","SF Mono",monospace; --bg:#0A1628; --panel:rgba(15,30,55,0.85); --header:rgba(10,30,60,0.95); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg-deep); color:var(--text); font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif; overflow:hidden; width:100vw; height:100vh; }
.header { position:fixed; top:0; left:0; right:0; height:64px; background:var(--header); backdrop-filter:blur(12px); border-bottom:1px solid var(--border-bright); display:flex; align-items:center; justify-content:space-between; padding:0 24px; z-index:1000; }
.back-btn { width:36px; height:36px; border:1px solid var(--border); background:rgba(0,191,255,0.08); border-radius:6px; color:var(--accent); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.main { padding:88px 24px 24px; display:grid; grid-template-columns:1fr 320px; gap:20px; height:100vh; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; }
.card-title { font-size:15px; font-weight:600; color:var(--accent); margin-bottom:12px; }
.video-box { flex:1; background:#0D1B2A; border-radius:6px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:14px; }
.timeline-bar { display:flex; align-items:center; gap:10px; margin-top:12px; }
.track { flex:1; height:6px; background:#1a2a3a; border-radius:3px; position:relative; }
.fill { position:absolute; left:0; top:0; height:100%; width:35%; background:var(--accent); border-radius:3px; }
.time-mark { font-size:12px; color:var(--text-dim); }
.clip-item { display:flex; align-items:center; gap:10px; padding:10px; border-radius:6px; cursor:pointer; margin-bottom:6px; }
.clip-item:hover { background:rgba(0,191,255,0.05); }
.clip-thumb { width:80px; height:48px; background:#0D1B2A; border-radius:4px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--text-dim); }
.clip-info { flex:1; }
.clip-time { font-size:12px; color:var(--text); }
.clip-duration { font-size:11px; color:var(--text-dim); }
</style>
<!-- === 弹窗组件 START === -->
<style>
.pc-toast-wrap { position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.pc-toast { padding:10px 24px; border-radius:6px; font-size:13px; font-weight:500; color:#fff; backdrop-filter:blur(8px); animation:pcToastIn 0.3s ease; pointer-events:auto; display:flex; align-items:center; gap:8px; box-shadow:0 4px 20px rgba(0,0,0,0.3); }
.pc-toast.success { background:rgba(0,120,191,0.92); border:1px solid rgba(0,191,255,0.4); }
.pc-toast.error { background:rgba(231,76,60,0.92); border:1px solid rgba(255,51,102,0.4); }
.pc-toast.info { background:rgba(52,152,219,0.92); border:1px solid rgba(64,169,255,0.4); }
@keyframes pcToastIn { from { opacity:0; transform:translateY(-20px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes pcToastOut { to { opacity:0; transform:translateY(-20px) scale(0.95); } }
.pc-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:9998; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
.pc-modal-overlay.active { display:flex; }
.pc-modal { background:rgba(15,30,55,0.96); border:1px solid rgba(0,191,255,0.25); border-radius:10px; padding:24px; min-width:360px; max-width:480px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
.pc-modal-title { font-size:16px; font-weight:600; color:#00BFFF; margin-bottom:12px; }
.pc-modal-body { font-size:14px; color:#FFFFFF; line-height:1.6; margin-bottom:20px; }
.pc-modal-actions { display:flex; justify-content:flex-end; gap:10px; }
.pc-btn { padding:8px 20px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; border:none; transition:all .15s; }
.pc-btn:hover { opacity:.9; }
.pc-btn-primary { background:linear-gradient(135deg,#00BFFF,#0077CC); color:#0A1628; }
.pc-btn-secondary { background:rgba(0,191,255,0.08); color:#00BFFF; border:1px solid rgba(0,191,255,0.25); }
.pc-loading-overlay { position:fixed; inset:0; background:rgba(10,22,40,0.7); z-index:9999; display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
.pc-loading-overlay.active { display:flex; }
.pc-loading-spinner { width:48px; height:48px; border:3px solid rgba(0,191,255,0.15); border-top-color:#00BFFF; border-radius:50%; animation:pcSpin 0.8s linear infinite; }
.pc-loading-text { color:#00BFFF; font-size:14px; }
@keyframes pcSpin { to { transform:rotate(360deg); } }
</style>
<div id="pcToastWrap" class="pc-toast-wrap"></div>
<div id="pcModalOverlay" class="pc-modal-overlay" onclick="if(event.target===this)closeModal()"><div class="pc-modal"><div id="pcModalTitle" class="pc-modal-title">提示</div><div id="pcModalBody" class="pc-modal-body">内容</div><div class="pc-modal-actions"><button class="pc-btn pc-btn-secondary" onclick="closeModal()">取消</button><button id="pcModalConfirm" class="pc-btn pc-btn-primary">确认</button></div></div></div>
<div id="pcLoadingOverlay" class="pc-loading-overlay"><div class="pc-loading-spinner"></div><div id="pcLoadingText" class="pc-loading-text">加载中...</div></div>
<script>
function showToast(msg,type){var w=document.getElementById('pcToastWrap');var t=document.createElement('div');t.className='pc-toast '+(type||'success');t.innerHTML=msg;w.appendChild(t);setTimeout(function(){t.style.animation='pcToastOut 0.3s ease forwards';setTimeout(function(){t.remove()},300)},2700);}
function showModal(title,body,onConfirm){document.getElementById('pcModalTitle').textContent=title||'提示';document.getElementById('pcModalBody').textContent=body||'';var btn=document.getElementById('pcModalConfirm');btn.onclick=function(){closeModal();if(onConfirm)onConfirm();};document.getElementById('pcModalOverlay').classList.add('active');}
function closeModal(){document.getElementById('pcModalOverlay').classList.remove('active');}
function showConfirm(title,body,onConfirm){showModal(title,body,onConfirm);}
function showLoading(msg){document.getElementById('pcLoadingText').textContent=msg||'加载中...';document.getElementById('pcLoadingOverlay').classList.add('active');}
function hideLoading(){document.getElementById('pcLoadingOverlay').classList.remove('active');}
</script>
<!-- === 弹窗组件 END === -->
</head>
<body>
<header class="header">
  <div style="display:flex;align-items:center;gap:16px;">
    <a href="P04-视频监控.html" class="back-link">&#x2039; 返回</a>
    <span style="font-size:18px;font-weight:600;color:var(--accent);">视频回放</span>
  </div>
  <span style="font-size:13px;color:var(--text-dim);">CAM-01 北门保护区入口</span>
</header>
<div class="main">
  <div class="left" style="display:flex;flex-direction:column;">
    <div class="video-box" style="flex:1;">[H.265 录像回放 - 05-12 10:30至11:00]</div>
    <div class="timeline-bar">
      <span class="time-mark">10:30:00</span>
      <div class="track"><div class="fill"></div></div>
      <span class="time-mark">11:00:00</span>
    </div>
  </div>
  <div class="right">
    <div class="card" style="height:100%;overflow-y:auto;">
      <div class="card-title">📄 录像片段</div>
      <div class="clip-item"><div class="clip-thumb">截图</div><div class="clip-info"><div class="clip-time">10:42:18 告警触发</div><div class="clip-duration">时长 2分钟</div></div></div>
      <div class="clip-item"><div class="clip-thumb">截图</div><div class="clip-info"><div class="clip-time">10:45:00 正常巡查</div><div class="clip-duration">时长 15分钟</div></div></div>
      <div class="clip-item"><div class="clip-thumb">截图</div><div class="clip-info"><div class="clip-time">10:30:00 开始录像</div><div class="clip-duration">时长 30分钟</div></div></div>
    </div>
  </div>
</div>
</body>
</html>
