<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>无人机查看 - 合阳洽川湿地智慧管理平台</title>
<style>
:root {
  --bg: #f0f4f3;
  --surface: #ffffff;
  --primary: #1a936f;
  --primary-dark: #147a5c;
  --primary-light: rgba(26, 147, 111, 0.08);
  --danger: #e74c3c;
  --text: #1a1a1a;
  --text-secondary: #666666;
  --text-tertiary: #999999;
  --border: #e8eceb;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
  min-height: 100vh;
  padding-bottom: calc(64px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling: touch;
}

.video-player {
  width: 100%;
  aspect-ratio: 16/9;
  background: linear-gradient(135deg, #1a2a2a, #0d1a1a);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.video-player::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle at 50% 50%, rgba(120,210,180,0.05) 0%, transparent 70%);
}
.video-placeholder {
  text-align: center;
  z-index: 2;
  color: var(--text-secondary);
}
.video-placeholder-icon { font-size: 48px; margin-bottom: 8px; opacity: 0.6; }
.video-placeholder-text { font-size: 14px; color: #7a9999; }

.video-info-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top));
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(180deg, rgba(0,0,0,0.5), transparent);
  z-index: 5;
}
.video-device-name { font-size: 14px; font-weight: 600; color: #fff; }
.video-live-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--danger);
  color: #fff;
  font-weight: 600;
}

.view-mode-tip {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.5);
  color: #fff;
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 12px;
  z-index: 5;
  backdrop-filter: blur(4px);
}

.device-section { padding: 16px; }
.device-section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 12px;
  padding-left: 4px;
}
.device-card {
  background: var(--surface);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.device-card:active { transform: scale(0.98); }
.device-card.active { border-color: var(--primary); background: var(--primary-light); }
.device-thumb {
  width: 80px; height: 56px;
  border-radius: 8px;
  background: linear-gradient(135deg, #e8f0ec, #d4e6df);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.device-info { flex: 1; min-width: 0; }
.device-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.device-meta { font-size: 12px; color: var(--text-secondary); }
.device-status {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.device-status.online { background: var(--primary); box-shadow: 0 0 6px rgba(26,147,111,0.4); }
.device-status.flying { background: var(--danger); box-shadow: 0 0 6px rgba(231,76,60,0.4); animation: pulse 1.5s infinite; }
.device-status.offline { background: var(--text-tertiary); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.bottom-tab {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(64px + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: flex-start;
  padding-top: 6px;
  z-index: 100;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 12px;
  color: var(--text-tertiary);
  font-size: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  position: relative;
  min-width: 56px;
}
.tab-item.active { color: var(--primary); }
.tab-icon { font-size: 24px; line-height: 1; }
</style>
<!-- === 弹窗组件 START === -->
<style>
.m-toast-wrap { position:fixed; top:calc(16px + env(safe-area-inset-top)); left:16px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.m-toast { padding:12px 16px; border-radius:10px; font-size:14px; font-weight:500; color:#fff; animation:mToastIn 0.3s ease; pointer-events:auto; display:flex; align-items:center; gap:8px; box-shadow:0 4px 16px rgba(0,0,0,0.15); }
.m-toast.success { background:linear-gradient(135deg,#1a936f,#147a5c); }
.m-toast.error { background:linear-gradient(135deg,#e74c3c,#c0392b); }
.m-toast.info { background:linear-gradient(135deg,#3498db,#2980b9); }
@keyframes mToastIn { from { opacity:0; transform:translateY(-20px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes mToastOut { to { opacity:0; transform:translateY(-20px) scale(0.95); } }
</style>
<div id="mToastWrap" class="m-toast-wrap"></div>
<script>
function showToast(msg,type){var w=document.getElementById('mToastWrap');var t=document.createElement('div');t.className='m-toast '+(type||'success');t.innerHTML=msg;w.appendChild(t);setTimeout(function(){t.style.animation='mToastOut 0.3s ease forwards';setTimeout(function(){t.remove()},300)},2700);}
</script>
<!-- === 弹窗组件 END === -->
</head>
<body>

<div class="video-player">
  <div class="video-info-bar">
    <span class="back-arrow" style="font-size:22px;color:#fff;cursor:pointer;" onclick="history.back()">&#x2039;</span>
    <span class="video-device-name">无人机 UAV-01</span>
    <span class="video-live-badge">&#x25CF; LIVE</span>
  </div>
  <div class="video-placeholder">
    <div class="video-placeholder-icon">&#x1F6F8;</div>
    <div class="video-placeholder-text">无人机实时画面</div>
  </div>
  <div class="view-mode-tip">查看模式 · 仅管理员可操作飞行</div>
</div>

<div class="device-section">
  <div class="device-section-title">无人机列表</div>

  <div class="device-card active">
    <div class="device-thumb">&#x1F6F8;</div>
    <div class="device-info">
      <div class="device-name">巡逻无人机 UAV-01</div>
      <div class="device-meta">航拍中 · 电量72% · 高度120m · 速度15m/s</div>
    </div>
    <div class="device-status flying"></div>
  </div>

  <div class="device-card">
    <div class="device-thumb">&#x1F6F8;</div>
    <div class="device-info">
      <div class="device-name">应急无人机 UAV-02</div>
      <div class="device-meta">待命 · 电量95% · 停机坪</div>
    </div>
    <div class="device-status online"></div>
  </div>

  <div class="device-card">
    <div class="device-thumb">&#x1F6F8;</div>
    <div class="device-info">
      <div class="device-name">边缘巡查机 UAV-03</div>
      <div class="device-meta">充电中 · 电量45% · 预计20分钟后完成</div>
    </div>
    <div class="device-status offline"></div>
  </div>
</div>

<nav class="bottom-tab">
  <div class="tab-item" onclick="location.href='M01-首页.html'">
    <span class="tab-icon">&#x1F3E0;</span>
    <span>首页</span>
  </div>
  <div class="tab-item" onclick="location.href='M03-工单.html'">
    <span class="tab-icon">&#x1F4CB;</span>
    <span>工单</span>
  </div>
  <div class="tab-item active">
    <span class="tab-icon">&#x1F6F8;</span>
    <span>无人机</span>
  </div>
  <div class="tab-item" onclick="location.href='M02-消息.html'">
    <span class="tab-icon">&#x1F4AC;</span>
    <span>消息</span>
  </div>
  <div class="tab-item" onclick="location.href='M04-我的.html'">
    <span class="tab-icon">&#x1F464;</span>
    <span>我的</span>
  </div>
</nav>

</body>
</html>
