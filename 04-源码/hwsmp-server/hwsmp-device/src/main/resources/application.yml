server:
  port: 8081

spring:
  application:
    name: hwsmp-device
  datasource:
    url: jdbc:postgresql://localhost:5432/hwsmp?currentSchema=public
    username: hwsmp
    password: hwsmp_dev_2024
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hwsmp.device.model
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.hwsmp: debug
