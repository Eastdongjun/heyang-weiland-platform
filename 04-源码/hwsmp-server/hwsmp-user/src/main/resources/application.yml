server:
  port: 8080

spring:
  application:
    name: hwsmp-user
  datasource:
    url: jdbc:postgresql://localhost:5432/hwsmp?currentSchema=public
    username: hwsmp
    password: hwsmp_dev_2024
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  data:
    redis:
      host: localhost
      port: 6379
      password: redis_dev_2024
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hwsmp.model
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt:
  secret: hwsmp_jwt_secret_key_2024_must_be_at_least_256_bits_long_for_hs256
  access-token-expire: 1800        # 30分钟
  refresh-token-expire: 604800     # 7天

# 日志
logging:
  level:
    com.hwsmp: debug
    org.springframework.security: info

# Knife4j API文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
